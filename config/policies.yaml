# Durability policies for Vault Object Storage
# Rules:
# - Rejects policy if available active nodes/zones do not fulfill criteria.
# - Never silently degrades placement unless explicitly configured for testing.

hot:
  scheme: replication
  replication_factor: 3
  data_write_quorum: 2
  data_read_quorum: 1
  minimum_distinct_zones: 3

durable:
  scheme: replication
  replication_factor: 4
  data_write_quorum: 3
  data_read_quorum: 1
  minimum_distinct_zones: 3

archive:
  scheme: erasure_coding
  data_fragments: 4
  parity_fragments: 2
  minimum_distinct_zones: 3
