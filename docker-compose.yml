services:
  # ==========================================
  # API Gateway
  # ==========================================
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m uvicorn apps.gateway.main:app --host 0.0.0.0 --port 8000
    container_name: vault-gateway
    ports:
      - "8000:8000"
    environment:
      - VAULT_ENV=development
      - VAULT_ROLE=gateway
      - VAULT_PORT=8000
      - VAULT_CLUSTER_CONFIG_PATH=/app/config/cluster.yaml
      - VAULT_POLICIES_CONFIG_PATH=/app/config/policies.yaml
      - VAULT_SECRET_KEY=${VAULT_SECRET_KEY:?Set VAULT_SECRET_KEY in .env before starting Vault}
    networks:
      - vault-net
    depends_on:
      - metadata-1
      - metadata-2
      - metadata-3

  # ==========================================
  # 3-Node Raft Metadata Cluster
  # ==========================================
  metadata-1:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m uvicorn apps.metadata_node.main:app --host 0.0.0.0 --port 9001
    container_name: vault-metadata-1
    environment:
      - NODE_ID=meta-1
      - BIND_ADDR=metadata-1:9002
      - PARTNERS=metadata-2:9002,metadata-3:9002
      - DATA_DIR=/data/meta-1
      - API_PORT=9001
    volumes:
      - meta-1-data:/data/meta-1
    networks:
      - vault-net

  metadata-2:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m uvicorn apps.metadata_node.main:app --host 0.0.0.0 --port 9001
    container_name: vault-metadata-2
    environment:
      - NODE_ID=meta-2
      - BIND_ADDR=metadata-2:9002
      - PARTNERS=metadata-1:9002,metadata-3:9002
      - DATA_DIR=/data/meta-2
      - API_PORT=9001
    volumes:
      - meta-2-data:/data/meta-2
    networks:
      - vault-net

  metadata-3:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m uvicorn apps.metadata_node.main:app --host 0.0.0.0 --port 9001
    container_name: vault-metadata-3
    environment:
      - NODE_ID=meta-3
      - BIND_ADDR=metadata-3:9002
      - PARTNERS=metadata-1:9002,metadata-2:9002
      - DATA_DIR=/data/meta-3
      - API_PORT=9001
    volumes:
      - meta-3-data:/data/meta-3
    networks:
      - vault-net

  # ==========================================
  # 6 Storage Nodes (Across 3 Zones)
  # ==========================================
  storage-1:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m uvicorn apps.storage_node.main:app --host 0.0.0.0 --port 8001
    container_name: vault-storage-1
    environment:
      - NODE_ID=store-1
      - REGION=us-east-1
      - ZONE=us-east-1a
      - VAULT_DATA_DIR=/data/storage-1
      - VAULT_PORT=8001
      - VAULT_SECRET_KEY=${VAULT_SECRET_KEY:?Set VAULT_SECRET_KEY in .env before starting Vault}
    volumes:
      - storage-1-data:/data/storage-1
    networks:
      - vault-net

  storage-2:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m uvicorn apps.storage_node.main:app --host 0.0.0.0 --port 8001
    container_name: vault-storage-2
    environment:
      - NODE_ID=store-2
      - REGION=us-east-1
      - ZONE=us-east-1a
      - VAULT_DATA_DIR=/data/storage-2
      - VAULT_PORT=8001
      - VAULT_SECRET_KEY=${VAULT_SECRET_KEY:?Set VAULT_SECRET_KEY in .env before starting Vault}
    volumes:
      - storage-2-data:/data/storage-2
    networks:
      - vault-net

  storage-3:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m uvicorn apps.storage_node.main:app --host 0.0.0.0 --port 8001
    container_name: vault-storage-3
    environment:
      - NODE_ID=store-3
      - REGION=us-east-1
      - ZONE=us-east-1b
      - VAULT_DATA_DIR=/data/storage-3
      - VAULT_PORT=8001
      - VAULT_SECRET_KEY=${VAULT_SECRET_KEY:?Set VAULT_SECRET_KEY in .env before starting Vault}
    volumes:
      - storage-3-data:/data/storage-3
    networks:
      - vault-net

  storage-4:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m uvicorn apps.storage_node.main:app --host 0.0.0.0 --port 8001
    container_name: vault-storage-4
    environment:
      - NODE_ID=store-4
      - REGION=us-east-1
      - ZONE=us-east-1b
      - VAULT_DATA_DIR=/data/storage-4
      - VAULT_PORT=8001
      - VAULT_SECRET_KEY=${VAULT_SECRET_KEY:?Set VAULT_SECRET_KEY in .env before starting Vault}
    volumes:
      - storage-4-data:/data/storage-4
    networks:
      - vault-net

  storage-5:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m uvicorn apps.storage_node.main:app --host 0.0.0.0 --port 8001
    container_name: vault-storage-5
    environment:
      - NODE_ID=store-5
      - REGION=us-east-1
      - ZONE=us-east-1c
      - VAULT_DATA_DIR=/data/storage-5
      - VAULT_PORT=8001
      - VAULT_SECRET_KEY=${VAULT_SECRET_KEY:?Set VAULT_SECRET_KEY in .env before starting Vault}
    volumes:
      - storage-5-data:/data/storage-5
    networks:
      - vault-net

  storage-6:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m uvicorn apps.storage_node.main:app --host 0.0.0.0 --port 8001
    container_name: vault-storage-6
    environment:
      - NODE_ID=store-6
      - REGION=us-east-1
      - ZONE=us-east-1c
      - VAULT_DATA_DIR=/data/storage-6
      - VAULT_PORT=8001
      - VAULT_SECRET_KEY=${VAULT_SECRET_KEY:?Set VAULT_SECRET_KEY in .env before starting Vault}
    volumes:
      - storage-6-data:/data/storage-6
    networks:
      - vault-net

  # ==========================================
  # Optional Prometheus Service
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: vault-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - vault-net

  # ==========================================
  # Toxiproxy Fault Injection Service
  # ==========================================
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: vault-toxiproxy
    command: -host=0.0.0.0 -config=/etc/toxiproxy/toxiproxy.json
    ports:
      - "8474:8474" # Toxiproxy Management API
      - "8501:8501" # Toxiproxy route -> storage-1:8001
      - "8502:8502" # Toxiproxy route -> storage-2:8001
      - "8503:8503" # Toxiproxy route -> storage-3:8001
      - "8504:8504" # Toxiproxy route -> storage-4:8001
      - "8505:8505" # Toxiproxy route -> storage-5:8001
      - "8506:8506" # Toxiproxy route -> storage-6:8001
      - "9501:9501" # Toxiproxy route -> metadata-1:9001
      - "9502:9502" # Toxiproxy route -> metadata-2:9001
      - "9503:9503" # Toxiproxy route -> metadata-3:9001
    volumes:
      - ./config/toxiproxy.json:/etc/toxiproxy/toxiproxy.json:ro
    networks:
      - vault-net
    depends_on:
      - storage-1
      - storage-2
      - storage-3
      - storage-4
      - storage-5
      - storage-6
      - metadata-1
      - metadata-2
      - metadata-3

volumes:
  meta-1-data:
  meta-2-data:
  meta-3-data:
  storage-1-data:
  storage-2-data:
  storage-3-data:
  storage-4-data:
  storage-5-data:
  storage-6-data:

networks:
  vault-net:
    driver: bridge
